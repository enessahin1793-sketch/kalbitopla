<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emrivaki Kart Oyunu</title>
<style>
body{
    margin:0;
    height:100vh;
    background:radial-gradient(circle at top,#2a000c,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    color:#fff;
    text-align:center;
}
.card{
    width:90%;
    max-width:420px;
    padding:32px;
    background:rgba(0,0,0,.85);
    border-radius:28px;
    box-shadow:0 0 40px rgba(255,0,60,.55);
}
h2{color:#ff2f6d;}
.note{font-size:13px;opacity:.7;margin-bottom:10px;}
button{
    margin:10px 6px 0;
    padding:15px 28px;
    font-size:18px;
    border:none;
    border-radius:40px;
    background:#ff2f6d;
    color:white;
}
button.ceza{background:#ff9f1a;}
button:active{transform:scale(.95);}
</style>
</head>
<body>

<div class="card">
    <h2>🔥 Kartı Çek 🔥</h2>
    <div class="note">Okuyan yapar. Yapmazsan ceza.</div>
    <p id="task">Hazırsan çek…</p>
    <button onclick="drawCard()">Kart Çek</button>
    <button class="ceza" onclick="drawPenalty()">Ceza</button>
</div>

<script>
// EMRİVAKİ ANA KARTLAR (rol yazmaz, emir verir)
const cards = [
"Kucakta mı yatarak mı seç ve başlat",
"Eller arkada dokunmak yasak ağzınla tahrik et",
"Partnerine çıplak şekilde sürtünmeye başla",
"Boynuna yavaş ve uzun bir öpücük kondur",
"Karşındakinin kafasını tut ve özel bölgene bastır (30 sn)",
"Karşı tarafın özel bölgesini tut ve 30 saniye okşa",
"Partnerini 40 saniye boyunca tahrik etmeye çalış",
"Zevk alacağı yerlere yavaşça dokun",
"Partnerini istediği bir yerden öp",
"Partnerine zorla özel bölgeni yalat 60 sn",

"Boynuna yaklaş ve orada kal (15 sn)",
"Bir şekilde karşındakinin seni susturmasını sağla (30 sn)",
"Partnerinizle birbirinizi aynı anda yalayın",
"Karşındakinin kafasını tut ve özel bölgene bastır (30 sn)",
"Karşındakinin istediği bir bölgesini yala (60 sn)",
"Kulağına adını fısılda ve sıcak nefesini ver",
"Karşındakinin dudaklarını em ve ısır",
"30 saniye boyunca partnerinin boynunu yala",
"Partnerinizin cinsel organını kendinize hafifçe bastırın",
"Partnerinin istediği her hangi bir şeyi yap",

"Partnerinin dilini emerek tüm yüzünü yala",
"Kendi özel bölgeni partnerinin gözlerine bakarak okşa (30 sn)",
"Gözlerini kapat ağzını aç ve bekle (20 sn)",
"En çok yükseldiğin şeyi söyle ve karşındaki onu yapsın",
"Partnerinden bir emir al ve ne olursa yapmak zorundasın",
"Partnerin kulağına yaklaşıp ateşli kelimeler fısıldayacak",
"Bakışlarınla yönlendir",
"Partnerine bir emir ver ve ne olursa yapmak zorunda",
"Partnerin senin özel bölgeni tutup 30 saniye okşayacak",
"Karşındakinin kafasını tut ve özel bölgene bastır (30sn)"
];

// YAPMAYANA CEZALAR (+18 ama yumuşak)
const penalties = [
"30 saniye boyunca inleyerek boynunu yalat",
"30 saniye kendi parmağını em",
"Gözler kapalı bekle karşındaki sana istediğini yapabilir (60 sn)",
"Özel bölgeni tut ve okşa (30 sn)",
"Kıyafetlerinden birini partnerine ağzıyla çıkarttır",
"Partnerinin en sevdiği pozisyona gel ve 40 saniye o pozisyonda sana hükmetsin",
"Ellerini ve gözlerini bağlatıp tüm kontrolü partnerine ver",
"Partnerinin seni boğması için yalvar ve kendini boğdurt 1 dakika (Yüze oturma, ağza verme)",
"Partnerinden senin canını çok fazla yakacak bir şey için yalvar",
"Karşındakinin sana 3 defa tokat atması için yalvar"
];

function drawCard(){
    const r = Math.floor(Math.random()*cards.length);
    document.getElementById("task").innerText = cards[r];
}

function drawPenalty(){
    const r = Math.floor(Math.random()*penalties.length);
    document.getElementById("task").innerText = penalties[r];
}
</script>

</body>
</html>
