<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yılan Oyunu 🐍</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    touch-action: none;
  }
  canvas {
    background: #222;
    border-radius: 12px;
  }
</style>
</head>
<body>

<canvas id="game" width="320" height="320"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 16;
const canvasSize = 20;

let snake, food, dir, gameOver;

function startGame() {
  snake = [{ x: 10, y: 10 }];
  food = spawnFood();
  dir = "RIGHT";
  gameOver = false;
}

function spawnFood() {
  return {
    x: Math.floor(Math.random() * canvasSize),
    y: Math.floor(Math.random() * canvasSize)
  };
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Yılan
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#00ff99" : "#00cc77";
    ctx.fillRect(s.x * box, s.y * box, box, box);
  });

  // Yem
  ctx.fillStyle = "#ff4d6d";
  ctx.fillRect(food.x * box, food.y * box, box, box);
}

function update() {
  if (gameOver) return;

  const head = { ...snake[0] };

  if (dir === "LEFT") head.x--;
  if (dir === "RIGHT") head.x++;
  if (dir === "UP") head.y--;
  if (dir === "DOWN") head.y++;

  // Çarpma kontrolü
  if (
    head.x < 0 || head.y < 0 ||
    head.x >= canvasSize || head.y >= canvasSize ||
    snake.some(s => s.x === head.x && s.y === head.y)
  ) {
    gameOver = true;
    drawGameOver();
    return;
  }

  snake.unshift(head);

  // Yem yeme
  if (head.x === food.x && head.y === food.y) {
    food = spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.font = "20px Arial";
  ctx.textAlign = "center";
  ctx.fillText("Oyun Bitti", canvas.width / 2, canvas.height / 2 - 10);
  ctx.font = "14px Arial";
  ctx.fillText("Yeniden başlamak için dokun", canvas.width / 2, canvas.height / 2 + 15);
}

// PC kontrol
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && dir !== "RIGHT") dir = "LEFT";
  if (e.key === "ArrowRight" && dir !== "LEFT") dir = "RIGHT";
  if (e.key === "ArrowUp" && dir !== "DOWN") dir = "UP";
  if (e.key === "ArrowDown" && dir !== "UP") dir = "DOWN";
});

// Mobil kontrol (kaydırma)
let startX, startY;
canvas.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

canvas.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir !== "LEFT") dir = "RIGHT";
    else if (dx < 0 && dir !== "RIGHT") dir = "LEFT";
  } else {
    if (dy > 0 && dir !== "UP") dir = "DOWN";
    else if (dy < 0 && dir !== "DOWN") dir = "UP";
  }
});

// Restart
canvas.addEventListener("click", () => {
  if (gameOver) startGame();
});

startGame();
setInterval(update, 120);
</script>

</body>
</html>
