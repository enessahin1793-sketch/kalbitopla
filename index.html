<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rol & Ceza Çift Oyunu</title>
<style>
body{
    margin:0;
    height:100vh;
    background:radial-gradient(circle at top,#4b0015,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    color:#fff;
    text-align:center;
}
.card{
    width:90%;
    max-width:430px;
    padding:34px;
    background:rgba(0,0,0,.85);
    border-radius:30px;
    box-shadow:0 0 45px rgba(255,0,90,.6);
}
h2{color:#ff1e5a;}
.role{font-size:15px; margin-bottom:6px; opacity:.9;}
.level{font-size:13px; opacity:.7; margin-bottom:12px;}
button{
    margin:10px 6px 0;
    padding:14px 26px;
    font-size:17px;
    border:none;
    border-radius:40px;
    background:#ff1e5a;
    color:white;
}
button.ceza{background:#ff8c1a;}
button:active{transform:scale(.95);}
</style>
</head>
<body>

<div class="card">
    <div class="role" id="role">Rol: Kontrolcü 😈</div>
    <div class="level" id="level">Tur: 1</div>
    <h2>ROL & CEZA</h2>
    <p id="task">Hazırsan kart çek…</p>
    <button onclick="drawCard()">Kart Çek</button>
    <button class="ceza" onclick="drawPenalty()">Ceza</button>
</div>

<script>
let turn = 1;
let controller = true;

const roleCards = [
"⏳ 30 sn: Teslim olan çok yakın duracak, dokunmak yasak",
"🚫 Konuşmak yasak: Sadece bakış (20 sn)",
"🔥 Teslim olana tek kelimelik bir komut ver",
"⏳ 20 sn: Yaklaş – dur – yaklaş – dur",
"🚫 Dokunmak yasak: Nefesini hissettir",
"🔥 Teslim olana beklemesini söyle",
"⏳ 15 sn: Teslim olan gözlerini kapatır",
"🚫 Gülmek yasak: Göz teması",
"🔥 Teslim olana neden şu an zorlandığını söylet",
"⏳ 30 sn: Yavaş ama bırakması yasak temas",

"🔥 Teslim olana ismini fısıldat",
"🚫 Konuşmak yasak: Sessiz yakınlık",
"⏳ 20 sn: Kontrolcü bakar, diğeri bekler",
"🔥 Teslim olana kontrolü bıraktığını söylet",
"🚫 Dokunmak yasak: Boyuna yaklaş",

"🔥 Teslim olana ‘şimdi değil’ hissi yaşat",
"⏳ 30 sn: El tutma – bırakamaz",
"🚫 Göz kaçırmak yasak",
"🔥 Teslim olana seni en çok neyin ateşlediğini söylet",
"⏳ 15 sn: Kulak hizasında nefes"
];

const penalties = [
"🔥 Ceza: 20 saniye boyunca göz teması",
"⏳ Ceza: 30 saniye sessiz bekleme",
"🚫 Ceza: Konuşmak 1 tur yasak",
"🔥 Ceza: Kontrolcüye tek kelimeyle itiraf",
"⏳ Ceza: 20 saniye çok yakın durma",
"🚫 Ceza: Dokunmak 1 tur yasak",
"🔥 Ceza: Kontrolcüye fısıltıyla iltifat",
"⏳ Ceza: Gözler kapalı bekleme",
"🔥 Ceza: Kontrolcüye neden zorlandığını söyle",
"🚫 Ceza: Gülmek yasak (20 sn)"
];

function updateRole(){
    if(turn % 5 === 0){
        controller = !controller;
    }
    document.getElementById("role").innerText =
        controller ? "Rol: Kontrolcü 😈" : "Rol: Teslim Olan 🔥";
}

function drawCard(){
    const r = Math.floor(Math.random()*roleCards.length);
    document.getElementById("task").innerText = roleCards[r];
    turn++;
    document.getElementById("level").innerText = "Tur: " + turn;
    updateRole();
}

function drawPenalty(){
    const r = Math.floor(Math.random()*penalties.length);
    document.getElementById("task").innerText = penalties[r];
}
</script>

</body>
</html>
